{% load static %}
<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <link rel="stylesheet" href="{% static 'sub_part/styles.css' %}">
  <style>
      body {
          background: white;
          font-family: Arial;
          padding: 40px;
      }
      .card {
          width: 360px;
          margin: auto;
          padding: 30px;
          background: white;
          border-radius: 10px;
          box-shadow: 0px 0px 10px #d5d5d5;
      }
      input {
          width: 100%;
          padding: 10px;
          margin-top: 12px;
          border-radius: 6px;
          border: 1px solid #ccc;
      }
      button {
          width: 100%;
          padding: 12px;
          margin-top: 20px;
          background: #137fec;
          color: white;
          border: none;
          border-radius: 6px;
          cursor: pointer;
          font-size: 16px;
      }
      button:hover {
          background: #0d65c2;
      }
      a {
          display: block;
          margin-top: 20px;
          text-align: center;
      }
  </style>
</head>
<body>

<div class="card">
  <h2 style="text-align:center; font-weight:700;">Login</h2>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Log in</button>
  </form>

  <a href="{% url 'signup' %}">Create a new account</a>
</div>

</body>
</html>
