{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Sign Up</title>
    <link rel="stylesheet" href="{% static 'sub_part/styles.css' %}">
    <style>
        body {
            background: white;
            color: black;
            font-family: Arial, sans-serif;
            padding: 40px;
        }
        .card {
            width: 360px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            background: #ffffff;
            box-shadow: 0px 0px 8px #d6d6d6;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }
        .btn {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #137fec; /* blue */
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        .btn:hover {
            background: #0d65c2;
        }
        .link {
            margin-top: 15px;
            display: block;
            text-align: center;
        }
        .error, .success {
            color: red;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="card">

    <h2 style="text-align:center; font-weight:700; margin-bottom:20px;">
        Create Your Account
    </h2>

    {% for msg in messages %}
        <p class="error">{{ msg }}</p>
    {% endfor %}

    <form method="post">
        {% csrf_token %}

        <input type="text" name="name" placeholder="Full Name" required>

        <input type="email" name="email" placeholder="Email Address" required>

        <input type="password" name="password" placeholder="Password" required>

        <input type="password" name="confirm" placeholder="Confirm Password" required>

        <select name="country">
            <option value="">Select Country</option>
            <option>India</option>
            <option>USA</option>
            <option>UK</option>
            <option>Singapore</option>
            <option>Australia</option>
        </select>

        <select name="user_type">
            <option value="">Who are you?</option>
            <option>Student</option>
            <option>Working Professional</option>
            <option>Business Owner</option>
        </select>

        <input type="text" name="referral" placeholder="How did you hear about us?">

        <button class="btn" type="submit">Sign Up</button>
    </form>

    <a href="{% url 'login' %}" class="link">Already have an account? Log In</a>

</div>

</body>
</html>
